<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Jai Chan Spa · Review</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="../assets/style.css">
<style>
.wrap{max-width:460px;margin:0 auto;padding:20px 16px 40px;min-height:100vh}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.lang{width:auto;border:1px solid var(--line);background:#fff;border-radius:20px;padding:6px 10px;color:var(--ink)}
.top .brand{white-space:nowrap}
.card{background:var(--card);border-radius:20px;padding:24px 18px;box-shadow:0 6px 24px rgba(62,44,32,.06);text-align:center}
h1{font-size:21px;font-weight:600;margin:16px 0 4px;line-height:1.35}
.nick{font-size:15px;color:var(--muted);margin-top:10px}
.hint{color:var(--muted);font-size:14px;margin:4px 0 14px}
.stars{display:flex;justify-content:center;gap:6px}
.star{background:none;border:0;padding:4px;font-size:46px;line-height:1;color:#DDD3C8;transition:transform .12s,color .12s}
.star.on{color:var(--gold)}
.star:active{transform:scale(1.2)}
.slabel{height:22px;margin-top:6px;font-weight:600;color:var(--brand-d)}
.q{font-weight:600;margin:22px 0 10px;text-align:left}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:22px;padding:9px 14px;font-size:14px;color:var(--ink)}
.chip.on{background:var(--brand-d);border-color:var(--brand-d);color:#fff}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg .chip{text-align:center}
.svc{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
textarea,select{width:100%;border:1.5px solid var(--line);border-radius:14px;padding:12px;font:inherit;background:#fff;color:var(--ink)}
textarea{min-height:80px;resize:vertical}
.primary{width:100%;border:0;border-radius:16px;background:var(--brand-d);color:#fff;padding:15px;font-size:17px;font-weight:600;margin-top:22px}
.primary:disabled{opacity:.6}
.link{background:none;border:0;color:var(--muted);margin-top:12px;text-decoration:underline}
.big{font-size:56px;margin:6px 0}
.gbtn{display:inline-block;margin-top:14px;padding:13px 20px;border-radius:14px;background:#fff;border:1.5px solid var(--brand-d);color:var(--brand-d);text-decoration:none;font-weight:600}
.err{color:var(--bad);font-size:14px;margin-top:10px;min-height:18px}
.hide{display:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div class="brand">Jai Chan</div><select id="lang" class="lang" aria-label="Language"></select></div>

  <!-- Step 1: stars -->
  <section id="s1" class="card">
    <div id="av"></div>
    <div class="nick" id="nick"></div>
    <h1 id="title"></h1>
    <p class="hint" id="tap"></p>
    <div class="stars" id="stars"></div>
    <div class="slabel" id="slabel"></div>
  </section>

  <!-- Step 2: optional details -->
  <section id="s2" class="card hide" style="text-align:left">
    <div class="stars" id="stars2" style="margin-bottom:4px"></div>
    <div class="q" id="chipQ"></div><div class="chips" id="chips"></div>
    <div class="q" id="rebookQ"></div><div class="seg" id="rebook"></div>
    <div class="q" id="svcQ"></div><div class="svc" id="svc"></div>
    <div class="q" id="cmtQ"></div><textarea id="cmt" maxlength="800"></textarea>
    <div class="q" id="ctyQ"></div><select id="cty"></select>
    <button class="primary" id="send"></button>
    <div style="text-align:center"><button class="link" id="skip"></button></div>
    <div class="err" id="err"></div>
  </section>

  <!-- Step 3: thanks -->
  <section id="s3" class="card hide">
    <div class="big">🙏</div>
    <h1 id="thx"></h1>
    <p class="hint" id="thxMsg"></p>
    <div id="gbox" class="hide"><p id="gAsk"></p><a id="gbtn" class="gbtn" target="_blank" rel="noopener"></a></div>
    <p id="sorry" class="hint hide"></p>
  </section>

  <section id="nf" class="card hide"><h1 id="nfMsg"></h1></section>
</div>

<script src="../assets/config.js"></script>
<script src="../assets/i18n.js"></script>
<script src="../assets/common.js"></script>
<script>
(function(){
  const C = window.JC_CONFIG, I = window.JC_I18N;
  const $ = id => document.getElementById(id);
  const params = new URLSearchParams(location.search);
  const staff = C.STAFF.find(s => s.id === params.get("t"));
  const state = { id: JC.uuid(), stars: 0, chips: [], rebook: "", service: "", saved: false };

  // language: ?lang= > saved > browser
  let lang = params.get("lang") || JC.store.get("jc_lang") || (navigator.language||"en").slice(0,2).toLowerCase();
  if (!I[lang]) lang = "en";
  Object.keys(I).forEach(k => { const o = document.createElement("option"); o.value = k; o.textContent = I[k]._name; $("lang").appendChild(o); });
  $("lang").value = lang;
  $("lang").onchange = e => { lang = e.target.value; JC.store.set("jc_lang", lang); render(); };

  if (!staff) { $("s1").classList.add("hide"); $("nf").classList.remove("hide"); }
  else { $("av").appendChild(JC.avatar(staff)); }

  function T(k){ return (I[lang][k] ?? I.en[k]); }
  function fill(s){ return s.replace("{name}", staff ? staff.nick : ""); }

  function starRow(el, onPick){
    el.innerHTML = "";
    for (let i=1;i<=5;i++){
      const b = document.createElement("button");
      b.className = "star" + (i<=state.stars?" on":""); b.textContent = "★"; b.setAttribute("aria-label", i+" / 5");
      b.onclick = () => onPick(i);
      el.appendChild(b);
    }
  }
  function pickStars(n){
    state.stars = n; render();
    // save star rating immediately (even if the customer closes the page)
    JC.post({ action:"review", id:state.id, t:staff.id, stars:n, lang, device:JC.deviceId() }).then(()=>state.saved=true).catch(()=>{});
    setTimeout(()=>{ $("s1").classList.add("hide"); $("s2").classList.remove("hide"); window.scrollTo(0,0); }, 350);
  }
  function toggle(arr, v){ const i = arr.indexOf(v); i<0 ? arr.push(v) : arr.splice(i,1); }

  function render(){
    document.documentElement.lang = lang;
    $("nfMsg").textContent = T("notFound");
    if (!staff) return;
    $("nick").textContent = staff.nick;
    $("title").textContent = fill(T("title"));
    $("tap").textContent = T("tap");
    starRow($("stars"), pickStars);
    starRow($("stars2"), n => { state.stars = n; render(); });
    $("slabel").textContent = state.stars ? T("stars")[state.stars-1] : "";
    $("chipQ").textContent = state.stars >= 4 ? T("loved") : T("better");
    const ch = $("chips"); ch.innerHTML = "";
    C.CHIPS.forEach(k => { const b = document.createElement("button"); b.className = "chip"+(state.chips.includes(k)?" on":""); b.textContent = T("chips")[k]; b.onclick=()=>{toggle(state.chips,k);render();}; ch.appendChild(b); });
    $("rebookQ").textContent = fill(T("rebook"));
    const rb = $("rebook"); rb.innerHTML = "";
    ["yes","maybe","no"].forEach(k => { const b = document.createElement("button"); b.className="chip"+(state.rebook===k?" on":""); b.textContent=T(k); b.onclick=()=>{state.rebook = state.rebook===k?"":k; render();}; rb.appendChild(b); });
    $("svcQ").textContent = T("service");
    const sv = $("svc"); sv.innerHTML = "";
    C.SERVICES.forEach(k => { const b = document.createElement("button"); b.className="chip"+(state.service===k?" on":""); b.textContent=T("services")[k]; b.onclick=()=>{state.service = state.service===k?"":k; render();}; sv.appendChild(b); });
    $("cmtQ").textContent = T("comment"); $("cmt").placeholder = T("placeholder");
    $("ctyQ").textContent = T("country");
    const cty = $("cty");
    if (!cty.options.length){
      cty.appendChild(new Option("—", ""));
      C.COUNTRIES.forEach(([c,n]) => cty.appendChild(new Option(n, c)));
      cty.value = ({th:"TH",zh:"CN",ja:"JP",ko:"KR"})[lang] || "";
    }
    $("send").textContent = T("submit"); $("skip").textContent = T("skip");
    $("thx").textContent = T("thanks"); $("thxMsg").textContent = fill(T("thanksMsg"));
    $("gAsk").textContent = T("googleAsk"); $("gbtn").textContent = T("googleBtn");
    $("sorry").textContent = T("sorry");
  }

  function finish(){
    $("s2").classList.add("hide"); $("s3").classList.remove("hide");
    if (state.stars === 5 && C.GOOGLE_REVIEW_URL){ $("gbtn").href = C.GOOGLE_REVIEW_URL; $("gbox").classList.remove("hide"); }
    if (state.stars <= 2) $("sorry").classList.remove("hide");
  }
  $("send").onclick = async () => {
    $("send").disabled = true; $("err").textContent = "";
    try {
      await JC.post({ action:"review", id:state.id, t:staff.id, stars:state.stars, chips:state.chips.join(","),
        rebook:state.rebook, service:state.service, comment:$("cmt").value.trim(), country:$("cty").value,
        lang, device:JC.deviceId() });
      finish();
    } catch(e){ $("err").textContent = T("error"); $("send").disabled = false; }
  };
  $("skip").onclick = () => { if (!state.saved) JC.post({ action:"review", id:state.id, t:staff.id, stars:state.stars, lang, device:JC.deviceId() }).catch(()=>{}); finish(); };

  render();
})();
</script>
</body>
</html>
